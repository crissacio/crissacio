# Dibuja la viborita que se come las contribuciones. Se actualiza sola todos los días.
name: Viborita de contribuciones

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#0b0b0c&color_dots=#ebedf0,#e4ffa8,#c6ff3d,#9bd420,#5d8a00
            dist/snake-dark.svg?palette=github-dark&color_snake=#c6ff3d&color_dots=#161b22,#2d3a12,#4d6b10,#86c41c,#c6ff3d

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
